<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Chat</title>
  
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BMCLEN1ZWQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BMCLEN1ZWQ');
  </script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      /* Dynamic background - will be set by JS */
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-size: cover;
      background-position: center;
    }
    
    .chat-app {
      width: 100%;
      height: 100vh;
      display: flex;
      backdrop-filter: blur(20px);
      background: rgba(0, 0, 0, 0.3);
    }
    
    /* ========== SIDEBAR (Servers/DMs) ========== */
    .sidebar {
      width: 280px;
      background: rgba(15, 15, 20, 0.85);
      backdrop-filter: blur(40px);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
    }
    
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.3);
    }
    
    .sidebar-tabs {
      display: flex;
      gap: 8px;
    }
    
    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }
    
    .tab-btn.active {
      background: rgba(103, 126, 234, 0.5);
      border-color: rgba(103, 126, 234, 0.8);
      color: white;
    }
    
    .channels-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
    }
    
    .channel-category {
      color: rgba(255, 255, 255, 0.5);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 12px 6px;
      margin-top: 12px;
    }
    
    .channel-category:first-child {
      margin-top: 0;
    }
    
    .channel-item, .dm-item {
      padding: 10px 12px;
      margin: 2px 0;
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .channel-item:hover, .dm-item:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }
    
    .channel-item.active, .dm-item.active {
      background: rgba(103, 126, 234, 0.4);
      color: white;
    }
    
    .channel-icon {
      font-size: 16px;
      opacity: 0.7;
    }
    
    .dm-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
      position: relative;
    }
    
    .dm-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .online-indicator {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 12px;
      height: 12px;
      background: #10b981;
      border-radius: 50%;
      border: 2px solid rgba(15, 15, 20, 0.9);
      box-shadow: 0 0 8px #10b981;
    }
    
    .add-dm-btn {
      width: 100%;
      padding: 10px;
      background: rgba(103, 126, 234, 0.3);
      border: 1px dashed rgba(103, 126, 234, 0.6);
      border-radius: 8px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    
    .add-dm-btn:hover {
      background: rgba(103, 126, 234, 0.5);
      border-style: solid;
    }
    
    /* ========== CHAT AREA ========== */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.03);
    }
    
    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .channel-name {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-size: 16px;
      font-weight: 700;
    }
    
    .channel-desc {
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      margin-left: 30px;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .chat-messages::-webkit-scrollbar {
      width: 8px;
    }
    
    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }
    
    .message-group {
      display: flex;
      gap: 12px;
      animation: messageSlide 0.3s ease;
    }
    
    @keyframes messageSlide {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }
    
    .message-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .message-content {
      flex: 1;
    }
    
    .message-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    
    .message-author {
      color: white;
      font-weight: 700;
      font-size: 15px;
    }
    
    .message-author.bot {
      background: rgba(88, 101, 242, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    
    .message-time {
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
    }
    
    .message-text {
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.5;
      word-wrap: break-word;
      font-size: 14px;
    }
    
    .message-text a {
      color: #5865F2;
      text-decoration: none;
      font-weight: 600;
    }
    
    .message-text a:hover {
      text-decoration: underline;
    }
    
    .system-message {
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      font-style: italic;
      padding: 8px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      margin: 8px 0;
    }
    
    /* ========== MESSAGE INPUT ========== */
    .chat-input-container {
      padding: 20px;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .chat-input-wrapper {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
    }
    
    .chat-input-wrapper:focus-within {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(103, 126, 234, 0.6);
    }
    
    .emoji-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      opacity: 0.7;
      transition: all 0.2s;
      padding: 4px;
    }
    
    .emoji-btn:hover {
      opacity: 1;
      transform: scale(1.1);
    }
    
    .chat-input {
      flex: 1;
      background: none;
      border: none;
      color: white;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    
    .chat-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    
    .send-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .send-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(103, 126, 234, 0.4);
    }
    
    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    /* ========== MEMBERS SIDEBAR ========== */
    .members-sidebar {
      width: 240px;
      background: rgba(15, 15, 20, 0.85);
      backdrop-filter: blur(40px);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    
    .members-header {
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(0, 0, 0, 0.3);
    }
    
    .members-list {
      padding: 12px 8px;
    }
    
    .member-item {
      padding: 8px 12px;
      margin: 2px 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .member-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    
    .member-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
      position: relative;
    }
    
    .member-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .member-name {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      font-weight: 500;
    }
    
    .member-item:hover .member-name {
      color: white;
    }
    
    /* ========== EMOJI PICKER ========== */
    .emoji-picker {
      position: absolute;
      bottom: 90px;
      left: 20px;
      background: rgba(20, 20, 25, 0.98);
      backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px;
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      width: 300px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      z-index: 1000;
    }
    
    .emoji-picker.show {
      display: flex;
    }
    
    .emoji {
      font-size: 24px;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    
    .emoji:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.2);
    }
    
    /* ========== DM MODAL ========== */
    .dm-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    
    .dm-modal.show {
      display: flex;
    }
    
    .dm-modal-content {
      background: rgba(20, 20, 25, 0.98);
      backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    
    .dm-modal-header {
      color: white;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    
    .dm-search {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: white;
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
    }
    
    .dm-search::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    
    .dm-users-list {
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 16px;
    }
    
    .dm-user-item {
      padding: 12px;
      margin: 4px 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(255, 255, 255, 0.03);
    }
    
    .dm-user-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    
    .dm-modal-buttons {
      display: flex;
      gap: 12px;
    }
    
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(103, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    
    /* ========== RESPONSIVE ========== */
    @media (max-width: 1024px) {
      .members-sidebar {
        display: none;
      }
    }
    
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        left: -280px;
        z-index: 100;
        height: 100%;
        transition: left 0.3s;
      }
      
      .sidebar.show {
        left: 0;
      }
      
      .chat-messages {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="chat-app">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-tabs">
          <button class="tab-btn active" onclick="switchTab('server')">
            <span>🏠 Server</span>
          </button>
          <button class="tab-btn" onclick="switchTab('dms')">
            <span>💬 DMs</span>
          </button>
        </div>
      </div>
      
      <div class="channels-list" id="channelsList">
        <!-- Server Channels -->
        <div class="channel-category">📢 INFO</div>
        <div class="channel-item active" onclick="switchChannel('announcements')">
          <span class="channel-icon">📣</span>
          <span>announcements</span>
        </div>
        
        <div class="channel-category">💬 CHAT</div>
        <div class="channel-item" onclick="switchChannel('general')">
          <span class="channel-icon">#</span>
          <span>general</span>
        </div>
        
        <div class="channel-category">🔗 LINKS</div>
        <div class="channel-item" onclick="switchChannel('community-links')">
          <span class="channel-icon">🌐</span>
          <span>community-links</span>
        </div>
      </div>
      
      <div class="channels-list" id="dmsList" style="display: none;">
        <!-- Direct Messages will be populated here -->
        <button class="add-dm-btn" onclick="openDMModal()">
          ➕ Start New DM
        </button>
      </div>
    </div>
    
    <!-- Main Chat Area -->
    <div class="chat-main">
      <div class="chat-header">
        <div>
          <div class="channel-name" id="channelName">
            <span>📣</span>
            <span>announcements</span>
          </div>
          <div class="channel-desc" id="channelDesc">Important updates and news from Nova</div>
        </div>
      </div>
      
      <div class="chat-messages" id="chatMessages">
        <!-- Messages will be populated here -->
      </div>
      
      <div class="chat-input-container">
        <div class="emoji-picker" id="emojiPicker">
          <span class="emoji" onclick="insertEmoji('😀')">😀</span>
          <span class="emoji" onclick="insertEmoji('😂')">😂</span>
          <span class="emoji" onclick="insertEmoji('😍')">😍</span>
          <span class="emoji" onclick="insertEmoji('🥰')">🥰</span>
          <span class="emoji" onclick="insertEmoji('😎')">😎</span>
          <span class="emoji" onclick="insertEmoji('🤔')">🤔</span>
          <span class="emoji" onclick="insertEmoji('😊')">😊</span>
          <span class="emoji" onclick="insertEmoji('🎮')">🎮</span>
          <span class="emoji" onclick="insertEmoji('🎉')">🎉</span>
          <span class="emoji" onclick="insertEmoji('❤️')">❤️</span>
          <span class="emoji" onclick="insertEmoji('👍')">👍</span>
          <span class="emoji" onclick="insertEmoji('👎')">👎</span>
          <span class="emoji" onclick="insertEmoji('🔥')">🔥</span>
          <span class="emoji" onclick="insertEmoji('💯')">💯</span>
          <span class="emoji" onclick="insertEmoji('✨')">✨</span>
          <span class="emoji" onclick="insertEmoji('🚀')">🚀</span>
        </div>
        
        <div class="chat-input-wrapper">
          <button class="emoji-btn" onclick="toggleEmojiPicker()">😀</button>
          <input 
            type="text" 
            class="chat-input" 
            id="messageInput" 
            placeholder="Message #announcements"
            maxlength="2000"
          >
          <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
    
    <!-- Members Sidebar -->
    <div class="members-sidebar">
      <div class="members-header">
        <span id="memberCount">ONLINE — 0</span>
      </div>
      <div class="members-list" id="membersList">
        <!-- Members will be populated here -->
      </div>
    </div>
  </div>
  
  <!-- DM Modal -->
  <div class="dm-modal" id="dmModal">
    <div class="dm-modal-content">
      <div class="dm-modal-header">Start a Direct Message</div>
      <input 
        type="text" 
        class="dm-search" 
        id="dmSearch" 
        placeholder="Search users..."
      >
      <div class="dm-users-list" id="dmUsersList">
        <!-- Online users will be listed here -->
      </div>
      <div class="dm-modal-buttons">
        <button class="btn btn-secondary" onclick="closeDMModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getDatabase, ref, push, onValue, onDisconnect, set, remove, query, orderByChild, limitToLast } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDV9MRbv7IDXjowddQoXAN1hJPlCGMyxR8",
      authDomain: "nova-chat-43a18.firebaseapp.com",
      databaseURL: "https://nova-chat-43a18-default-rtdb.firebaseio.com",
      projectId: "nova-chat-43a18",
      storageBucket: "nova-chat-43a18.firebasestorage.app",
      messagingSenderId: "1090469740208",
      appId: "1:1090469740208:web:94adbe3ee21abb3cf14575"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // Get user info from Nova localStorage
    const username = localStorage.getItem('nova_user') || 'Guest';
    const profilePic = localStorage.getItem('nova_profile_pic') || '';
    const userId = username + '-' + Date.now().toString(36);

    // Current state
    let currentTab = 'server';
    let currentChannel = 'announcements';
    let currentDM = null;
    let userPresenceRef = null;
    let onlineUsers = {};

    // Set background from Nova settings
    const novaBackground = localStorage.getItem('nova_background_url');
    if (novaBackground) {
      document.body.style.backgroundImage = `url(${novaBackground})`;
    }

    // Initialize
    initializeChat();

    function initializeChat() {
      // Set up user presence
      userPresenceRef = ref(database, `presence/${userId}`);
      set(userPresenceRef, {
        username: username,
        profilePic: profilePic,
        timestamp: Date.now()
      });
      onDisconnect(userPresenceRef).remove();

      // Listen for online users
      onValue(ref(database, 'presence'), (snapshot) => {
        onlineUsers = snapshot.val() || {};
        updateMembersList();
        updateDMUsersList();
      });

      // Load initial channel
      loadChannel('announcements');
      
      // Add Nova Bot announcement
      setTimeout(() => {
        addSystemMessage('announcements', 'Welcome to Nova Chat! 🎉');
      }, 500);
    }

    // Switch tabs
    window.switchTab = function(tab) {
      currentTab = tab;
      
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.closest('.tab-btn').classList.add('active');
      
      if (tab === 'server') {
        document.getElementById('channelsList').style.display = 'block';
        document.getElementById('dmsList').style.display = 'none';
        switchChannel('announcements');
      } else {
        document.getElementById('channelsList').style.display = 'none';
        document.getElementById('dmsList').style.display = 'block';
        loadDMs();
      }
    };

    // Switch channel
    window.switchChannel = function(channel) {
      currentChannel = channel;
      currentDM = null;
      
      document.querySelectorAll('.channel-item').forEach(item => {
        item.classList.remove('active');
      });
      event.target.closest('.channel-item').classList.add('active');
      
      const channelNames = {
        'announcements': { name: '📣 announcements', desc: 'Important updates and news from Nova' },
        'general': { name: '# general', desc: 'General chat and discussion' },
        'community-links': { name: '🌐 community-links', desc: 'Share your favorite links and websites' }
      };
      
      const info = channelNames[channel] || { name: channel, desc: '' };
      document.getElementById('channelName').innerHTML = `<span>${info.name.split(' ')[0]}</span><span>${info.name.split(' ')[1]}</span>`;
      document.getElementById('channelDesc').textContent = info.desc;
      document.getElementById('messageInput').placeholder = `Message ${info.name}`;
      
      loadChannel(channel);
    };

    // Load channel messages
    function loadChannel(channel) {
      const messagesRef = ref(database, `channels/${channel}/messages`);
      const messagesQuery = query(messagesRef, orderByChild('timestamp'), limitToLast(50));
      
      onValue(messagesQuery, (snapshot) => {
        const messages = snapshot.val();
        displayMessages(messages, channel);
      });
    }

    // Display messages
    function displayMessages(messages, channel) {
      const container = document.getElementById('chatMessages');
      
      if (!messages) {
        // Show channel-specific welcome message
        if (channel === 'announcements') {
          container.innerHTML = `
            <div class="message-group">
              <div class="message-avatar">
                <span>🤖</span>
              </div>
              <div class="message-content">
                <div class="message-header">
                  <span class="message-author bot">Nova Bot</span>
                  <span class="message-time">${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true })}</span>
                </div>
                <div class="message-text">Welcome to Nova Chat! 🎉<br>We're still working on this server. Stay tuned for updates!</div>
              </div>
            </div>
          `;
        } else {
          container.innerHTML = `<div class="system-message">No messages yet. Be the first to say something! 👋</div>`;
        }
        return;
      }
      
      const messagesArray = Object.entries(messages)
        .map(([id, msg]) => ({ id, ...msg }))
        .sort((a, b) => a.timestamp - b.timestamp);
      
      container.innerHTML = messagesArray.map(msg => {
        const time = new Date(msg.timestamp).toLocaleTimeString('en-US', { 
          hour: 'numeric', 
          minute: '2-digit',
          hour12: true 
        });
        
        const isBot = msg.username === 'Nova Bot';
        const avatarContent = msg.profilePic 
          ? `<img src="${escapeHtml(msg.profilePic)}" alt="${escapeHtml(msg.username)}">` 
          : `<span>${getInitial(msg.username)}</span>`;
        
        // Convert URLs to clickable links
        let messageText = escapeHtml(msg.text);
        messageText = messageText.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
        
        return `
          <div class="message-group">
            <div class="message-avatar">
              ${avatarContent}
            </div>
            <div class="message-content">
              <div class="message-header">
                <span class="message-author ${isBot ? 'bot' : ''}">${escapeHtml(msg.username)}</span>
                <span class="message-time">${time}</span>
              </div>
              <div class="message-text">${messageText}</div>
            </div>
          </div>
        `;
      }).join('');
      
      container.scrollTop = container.scrollHeight;
    }

    // Send message
    window.sendMessage = function() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      
      if (!text) return;
      if (text.length > 2000) {
        alert('Message too long (max 2000 characters)');
        return;
      }
      
      const message = {
        username: username,
        profilePic: profilePic,
        text: text,
        timestamp: Date.now()
      };
      
      const channel = currentDM || currentChannel;
      const path = currentDM ? `dms/${currentDM}/messages` : `channels/${currentChannel}/messages`;
      
      push(ref(database, path), message);
      input.value = '';
    };

    // Enter key to send
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    // Emoji picker
    window.toggleEmojiPicker = function() {
      document.getElementById('emojiPicker').classList.toggle('show');
    };

    window.insertEmoji = function(emoji) {
      const input = document.getElementById('messageInput');
      input.value += emoji;
      input.focus();
      document.getElementById('emojiPicker').classList.remove('show');
    };

    // Close emoji picker when clicking outside
    document.addEventListener('click', (e) => {
      const picker = document.getElementById('emojiPicker');
      const emojiBtn = document.querySelector('.emoji-btn');
      if (!picker.contains(e.target) && !emojiBtn.contains(e.target)) {
        picker.classList.remove('show');
      }
    });

    // Update members list
    function updateMembersList() {
      const container = document.getElementById('membersList');
      const count = Object.keys(onlineUsers).length;
      
      document.getElementById('memberCount').textContent = `ONLINE — ${count}`;
      
      const members = Object.values(onlineUsers)
        .sort((a, b) => a.username.localeCompare(b.username));
      
      container.innerHTML = members.map(user => {
        const avatarContent = user.profilePic 
          ? `<img src="${escapeHtml(user.profilePic)}" alt="${escapeHtml(user.username)}">` 
          : `<span>${getInitial(user.username)}</span>`;
        
        return `
          <div class="member-item" onclick="startDM('${escapeHtml(user.username)}')">
            <div class="member-avatar">
              ${avatarContent}
              <div class="online-indicator"></div>
            </div>
            <div class="member-name">${escapeHtml(user.username)}</div>
          </div>
        `;
      }).join('');
    }

    // DM Modal
    window.openDMModal = function() {
      document.getElementById('dmModal').classList.add('show');
      updateDMUsersList();
    };

    window.closeDMModal = function() {
      document.getElementById('dmModal').classList.remove('show');
    };

    function updateDMUsersList() {
      const container = document.getElementById('dmUsersList');
      const users = Object.values(onlineUsers)
        .filter(user => user.username !== username)
        .sort((a, b) => a.username.localeCompare(b.username));
      
      if (users.length === 0) {
        container.innerHTML = '<div class="system-message">No other users online right now 😔</div>';
        return;
      }
      
      container.innerHTML = users.map(user => {
        const avatarContent = user.profilePic 
          ? `<img src="${escapeHtml(user.profilePic)}" alt="${escapeHtml(user.username)}">` 
          : `<span>${getInitial(user.username)}</span>`;
        
        return `
          <div class="dm-user-item" onclick="startDM('${escapeHtml(user.username)}')">
            <div class="dm-avatar">
              ${avatarContent}
              <div class="online-indicator"></div>
            </div>
            <div style="color: white;">${escapeHtml(user.username)}</div>
          </div>
        `;
      }).join('');
    }

    window.startDM = function(targetUsername) {
      closeDMModal();
      
      // Create DM ID (sorted usernames for consistency)
      const users = [username, targetUsername].sort();
      const dmId = `${users[0]}_${users[1]}`;
      
      currentDM = dmId;
      currentChannel = null;
      
      document.getElementById('channelName').innerHTML = `<span>💬</span><span>${escapeHtml(targetUsername)}</span>`;
      document.getElementById('channelDesc').textContent = `Direct message with ${targetUsername}`;
      document.getElementById('messageInput').placeholder = `Message @${targetUsername}`;
      
      // Load DM
      const dmRef = ref(database, `dms/${dmId}/messages`);
      onValue(dmRef, (snapshot) => {
        const messages = snapshot.val();
        displayMessages(messages, dmId);
      });
      
      // Switch to DMs tab
      switchTab('dms');
      loadDMs();
    };

    function loadDMs() {
      // This would load user's DM list from Firebase
      // For now, just show the add DM button
    }

    function addSystemMessage(channel, text) {
      const message = {
        username: 'Nova Bot',
        profilePic: '',
        text: text,
        timestamp: Date.now()
      };
      
      push(ref(database, `channels/${channel}/messages`), message);
    }

    // Helper functions
    function getInitial(name) {
      return name.charAt(0).toUpperCase();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (userPresenceRef) {
        remove(userPresenceRef);
      }
    });
  </script>
</body>
</html>
