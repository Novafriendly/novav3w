<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Chat</title>
  
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BMCLEN1ZWQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BMCLEN1ZWQ');
  </script>
  
  <style>
    *, *::before, *::after { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #dcddde;
      overflow: hidden;
      pointer-events: auto;
    }
    
    .chat-container {
      width: 100%;
      height: 100%;
      display: flex;
      padding-bottom: 70px;
      background: transparent;
    }
    
    /* ========== LEFT SIDEBAR ========== */
    .sidebar {
      width: 240px;
      background: #2f3136;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(0, 0, 0, 0.3);
    }
    
    .server-header {
      padding: 16px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.3);
      font-weight: 700;
      font-size: 15px;
      color: white;
      background: rgba(0, 0, 0, 0.2);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
    }
    
    .channels-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    
    .channels-container::-webkit-scrollbar {
      width: 6px;
    }
    
    .channels-container::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .channels-container::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 3px;
    }
    
    .channel-category {
      padding: 12px 8px 4px;
      color: #8e9297;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 16px;
    }
    
    .channel-category:first-child {
      margin-top: 0;
    }
    
    .channel {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      margin: 1px 0;
      border-radius: 4px;
      color: #96989d;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .channel:hover {
      background: rgba(79, 84, 92, 0.4);
      color: #dcddde;
    }
    
    .channel.active {
      background: rgba(79, 84, 92, 0.6);
      color: white;
    }
    
    .channel-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .channel-icon svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
    }
    
    /* ========== MAIN CHAT ========== */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #36393f;
    }
    
    .chat-header {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(0, 0, 0, 0.3);
      background: rgba(0, 0, 0, 0.15);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
    }
    
    .channel-name {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
      font-size: 16px;
      font-weight: 700;
    }
    
    .channel-name svg {
      width: 20px;
      height: 20px;
      color: #8e9297;
    }
    
    .channel-divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.06);
      margin: 0 12px;
    }
    
    .channel-topic {
      color: #8e9297;
      font-size: 14px;
      font-weight: 400;
    }
    
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    
    .messages-area::-webkit-scrollbar {
      width: 14px;
    }
    
    .messages-area::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .messages-area::-webkit-scrollbar-thumb {
      background: #202225;
      border: 3px solid #36393f;
      border-radius: 8px;
    }
    
    .message {
      display: flex;
      gap: 16px;
      padding: 4px 0;
      margin: 4px 0;
      transition: background 0.1s;
    }
    
    .message:hover {
      background: rgba(4, 4, 5, 0.07);
    }
    
    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: white;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
    }
    
    .message-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .message-content {
      flex: 1;
      min-width: 0;
    }
    
    .message-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }
    
    .message-author {
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    
    .message-author:hover {
      text-decoration: underline;
    }
    
    .bot-tag {
      background: #5865f2;
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    
    .message-timestamp {
      color: #a3a6aa;
      font-size: 12px;
      font-weight: 500;
    }
    
    .message-text {
      color: #dcddde;
      font-size: 15px;
      line-height: 1.375;
      word-wrap: break-word;
    }
    
    .message-text a {
      color: #00aff4;
      text-decoration: none;
    }
    
    .message-text a:hover {
      text-decoration: underline;
    }
    
    .welcome-message {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 16px;
      margin: 16px;
      background: rgba(88, 101, 242, 0.1);
      border-left: 4px solid #5865f2;
      border-radius: 8px;
    }
    
    .welcome-message h2 {
      color: white;
      font-size: 20px;
      margin-bottom: 8px;
    }
    
    .welcome-message p {
      color: #b9bbbe;
      font-size: 14px;
      line-height: 1.5;
    }
    
    /* ========== MESSAGE INPUT ========== */
    .message-input-container {
      padding: 16px;
    }
    
    .message-input-wrapper {
      background: rgba(64, 68, 75, 0.6);
      border-radius: 8px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
    }
    
    .message-input-wrapper:focus-within {
      background: rgba(64, 68, 75, 0.8);
    }
    
    .input-buttons {
      display: flex;
      gap: 4px;
    }
    
    .input-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: #b9bbbe;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
    }
    
    .input-btn:hover {
      color: #dcddde;
      background: rgba(79, 84, 92, 0.4);
    }
    
    .input-btn svg {
      width: 20px;
      height: 20px;
    }
    
    .message-input {
      flex: 1;
      background: none;
      border: none;
      color: #dcddde;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }
    
    .message-input::placeholder {
      color: #72767d;
    }
    
    /* ========== MEMBERS SIDEBAR ========== */
    .members-sidebar {
      width: 240px;
      background: #2f3136;
      border-left: 1px solid rgba(0, 0, 0, 0.3);
      overflow-y: auto;
    }
    
    .members-sidebar::-webkit-scrollbar {
      width: 6px;
    }
    
    .members-sidebar::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .members-sidebar::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 3px;
    }
    
    .members-section {
      padding: 24px 8px 0;
    }
    
    .members-title {
      padding: 0 8px 4px;
      color: #8e9297;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .member {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 8px;
      margin: 1px 0;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .member:hover {
      background: rgba(79, 84, 92, 0.3);
    }
    
    .member-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }
    
    .member-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .status-indicator {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 12px;
      height: 12px;
      background: #23a559;
      border: 3px solid #2f3136;
      border-radius: 50%;
    }
    
    .member-name {
      color: #b9bbbe;
      font-size: 14px;
      font-weight: 500;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .member:hover .member-name {
      color: #dcddde;
    }
    
    /* ========== EMOJI PICKER ========== */
    .emoji-picker {
      position: absolute;
      bottom: 100px;
      right: 16px;
      background: #2f3136;
      border: 1px solid rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 12px;
      display: none;
      flex-wrap: wrap;
      gap: 4px;
      width: 320px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
      z-index: 1000;
    }
    
    .emoji-picker.show {
      display: flex;
    }
    
    .emoji-item {
      font-size: 28px;
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      transition: all 0.15s;
      line-height: 1;
    }
    
    .emoji-item:hover {
      background: rgba(79, 84, 92, 0.4);
      transform: scale(1.1);
    }
    
    /* ========== RESPONSIVE ========== */
    @media (max-width: 1024px) {
      .members-sidebar {
        display: none;
      }
    }
    
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        left: -240px;
        z-index: 100;
        height: 100%;
        transition: left 0.3s;
      }
      
      .sidebar.show {
        left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <!-- Left Sidebar -->
    <div class="sidebar">
      <div class="server-header">Nova Chat</div>
      
      <div class="channels-container">
        <div class="channel-category">📢 INFO</div>
        <div class="channel active" onclick="switchChannel('announcements')">
          <div class="channel-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>
            </svg>
          </div>
          <span>announcements</span>
        </div>
        
        <div class="channel-category">💬 CHAT</div>
        <div class="channel" onclick="switchChannel('general')">
          <div class="channel-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/>
            </svg>
          </div>
          <span>general</span>
        </div>
        
        <div class="channel-category">🔗 LINKS</div>
        <div class="channel" onclick="switchChannel('community-links')">
          <div class="channel-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
            </svg>
          </div>
          <span>community-links</span>
        </div>
      </div>
    </div>
    
    <!-- Main Chat Area -->
    <div class="chat-main">
      <div class="chat-header">
        <div class="channel-name">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>
          </svg>
          <span id="channelNameText">announcements</span>
        </div>
        <div class="channel-divider"></div>
        <div class="channel-topic" id="channelTopic">Important updates and news from Nova</div>
      </div>
      
      <div class="messages-area" id="messagesArea">
        <!-- Messages will be inserted here -->
      </div>
      
      <div class="message-input-container">
        <div class="emoji-picker" id="emojiPicker">
          <span class="emoji-item" onclick="insertEmoji('😀')">😀</span>
          <span class="emoji-item" onclick="insertEmoji('😂')">😂</span>
          <span class="emoji-item" onclick="insertEmoji('😍')">😍</span>
          <span class="emoji-item" onclick="insertEmoji('🥰')">🥰</span>
          <span class="emoji-item" onclick="insertEmoji('😎')">😎</span>
          <span class="emoji-item" onclick="insertEmoji('🤔')">🤔</span>
          <span class="emoji-item" onclick="insertEmoji('😊')">😊</span>
          <span class="emoji-item" onclick="insertEmoji('😭')">😭</span>
          <span class="emoji-item" onclick="insertEmoji('🎮')">🎮</span>
          <span class="emoji-item" onclick="insertEmoji('🎉')">🎉</span>
          <span class="emoji-item" onclick="insertEmoji('❤️')">❤️</span>
          <span class="emoji-item" onclick="insertEmoji('💀')">💀</span>
          <span class="emoji-item" onclick="insertEmoji('👍')">👍</span>
          <span class="emoji-item" onclick="insertEmoji('👎')">👎</span>
          <span class="emoji-item" onclick="insertEmoji('🔥')">🔥</span>
          <span class="emoji-item" onclick="insertEmoji('💯')">💯</span>
          <span class="emoji-item" onclick="insertEmoji('✨')">✨</span>
          <span class="emoji-item" onclick="insertEmoji('🚀')">🚀</span>
          <span class="emoji-item" onclick="insertEmoji('⭐')">⭐</span>
          <span class="emoji-item" onclick="insertEmoji('💪')">💪</span>
        </div>
        
        <div class="message-input-wrapper">
          <div class="input-buttons">
            <button class="input-btn" onclick="toggleEmojiPicker()">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </button>
          </div>
          <input 
            type="text" 
            class="message-input" 
            id="messageInput" 
            placeholder="Message #announcements"

    <!-- Members Sidebar -->
    <div class="members-sidebar">
      <div class="members-section">
        <div class="members-title">
          <span>ONLINE</span>
          <span id="onlineCount">0</span>
        </div>
        <div id="membersList">
          <!-- Members will be inserted here -->
        </div>
      </div>

  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getDatabase, ref, push, onValue, onDisconnect, set, remove, query, orderByChild, limitToLast } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDV9MRbv7IDXjowddQoXAN1hJPlCGMyxR8",
      authDomain: "nova-chat-43a18.firebaseapp.com",
      databaseURL: "https://nova-chat-43a18-default-rtdb.firebaseio.com",
      projectId: "nova-chat-43a18",
      storageBucket: "nova-chat-43a18.firebasestorage.app",
      messagingSenderId: "1090469740208",
      appId: "1:1090469740208:web:94adbe3ee21abb3cf14575"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // Get user from Nova
    const username = localStorage.getItem('nova_user') || 'Guest';
    const profilePic = localStorage.getItem('nova_profile_pic') || '';
    const userId = username + '-' + Date.now().toString(36);

    let currentChannel = 'announcements';
    let userPresenceRef = null;
    let onlineUsers = {};

    initializeChat();

    function initializeChat() {
      userPresenceRef = ref(database, `presence/${userId}`);
      set(userPresenceRef, {
        username: username,
        profilePic: profilePic,
        timestamp: Date.now()
      });
      onDisconnect(userPresenceRef).remove();

      onValue(ref(database, 'presence'), (snapshot) => {
        onlineUsers = snapshot.val() || {};
        updateMembersList();
      });

      loadChannel('announcements');
      
      // Add welcome message to announcements
      setTimeout(() => {
        const welcomeExists = ref(database, 'channels/announcements/welcome');
        onValue(welcomeExists, (snapshot) => {
          if (!snapshot.exists()) {
            push(ref(database, 'channels/announcements/messages'), {
              username: 'Nova Bot',
              profilePic: '',
              text: 'Welcome to Nova Chat! 🎉\nWe\'re still working on this server. Stay tuned for updates!',
              timestamp: Date.now(),
              isBot: true
            });
            set(welcomeExists, true);
          }
        }, { onlyOnce: true });
      }, 500);
    }

    window.switchChannel = function(channel) {
      currentChannel = channel;
      
      document.querySelectorAll('.channel').forEach(ch => {
        ch.classList.remove('active');
      });
      event.target.closest('.channel').classList.add('active');
      
      const channelInfo = {
        'announcements': {
          name: 'announcements',
          topic: 'Important updates and news from Nova',
          icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>'
        },
        'general': {
          name: 'general',
          topic: 'General chat and discussion',
          icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/>'
        },
        'community-links': {
          name: 'community-links',
          topic: 'Share your favorite links and websites',
          icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>'
        }
      };
      
      const info = channelInfo[channel];
      document.querySelector('.channel-name svg').innerHTML = info.icon;
      document.getElementById('channelNameText').textContent = info.name;
      document.getElementById('channelTopic').textContent = info.topic;
      document.getElementById('messageInput').placeholder = `Message #${info.name}`;
      
      loadChannel(channel);
    };

    function loadChannel(channel) {
      const messagesRef = ref(database, `channels/${channel}/messages`);
      const messagesQuery = query(messagesRef, orderByChild('timestamp'), limitToLast(50));
      
      onValue(messagesQuery, (snapshot) => {
        const messages = snapshot.val();
        displayMessages(messages);
      });
    }

    function displayMessages(messages) {
      const container = document.getElementById('messagesArea');
      
      if (!messages) {
        container.innerHTML = `
          <div class="welcome-message">
            <h2>Welcome to #${currentChannel}!</h2>
            <p>This is the start of the #${currentChannel} channel. Be the first to say something!</p>
          </div>
        `;
        return;
      }
      
      const messagesArray = Object.entries(messages)
        .map(([id, msg]) => ({ id, ...msg }))
        .sort((a, b) => a.timestamp - b.timestamp);
      
      container.innerHTML = messagesArray.map(msg => {
        const time = new Date(msg.timestamp).toLocaleTimeString('en-US', { 
          hour: 'numeric', 
          minute: '2-digit',
          hour12: true 
        });
        
        const avatarContent = msg.profilePic 
          ? `<img src="${escapeHtml(msg.profilePic)}" alt="${escapeHtml(msg.username)}">` 
          : `<span>${getInitial(msg.username)}</span>`;
        
        const botTag = msg.isBot ? '<span class="bot-tag">BOT</span>' : '';
        
        let messageText = escapeHtml(msg.text);
        messageText = messageText.replace(/\n/g, '<br>');
        messageText = messageText.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
        
        return `
          <div class="message">
            <div class="message-avatar">${avatarContent}</div>
            <div class="message-content">
              <div class="message-header">
                <span class="message-author">${escapeHtml(msg.username)}</span>
                ${botTag}
                <span class="message-timestamp">${time}</span>
              </div>
              <div class="message-text">${messageText}</div>
            </div>
          </div>
        `;
      }).join('');
      
      container.scrollTop = container.scrollHeight;
    }

    window.sendMessage = function() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      
      if (!text) return;
      if (text.length > 2000) return;
      
      push(ref(database, `channels/${currentChannel}/messages`), {
        username: username,
        profilePic: profilePic,
        text: text,
        timestamp: Date.now(),
        isBot: false
      });
      
      input.value = '';
    };

    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    window.toggleEmojiPicker = function() {
      document.getElementById('emojiPicker').classList.toggle('show');
    };

    window.insertEmoji = function(emoji) {
      const input = document.getElementById('messageInput');
      input.value += emoji + ' ';
      input.focus();
      document.getElementById('emojiPicker').classList.remove('show');
    };

    document.addEventListener('click', (e) => {
      const picker = document.getElementById('emojiPicker');
      if (!picker.contains(e.target) && !e.target.closest('.input-btn')) {
        picker.classList.remove('show');
      }
    });

    function updateMembersList() {
      const container = document.getElementById('membersList');
      const count = Object.keys(onlineUsers).length;
      
      document.getElementById('onlineCount').textContent = count;
      
      const members = Object.values(onlineUsers)
        .sort((a, b) => a.username.localeCompare(b.username));
      
      container.innerHTML = members.map(user => {
        const avatarContent = user.profilePic 
          ? `<img src="${escapeHtml(user.profilePic)}" alt="${escapeHtml(user.username)}">` 
          : `<span>${getInitial(user.username)}</span>`;
        
        return `
          <div class="member">
            <div class="member-avatar">
              ${avatarContent}
              <div class="status-indicator"></div>
            </div>
            <div class="member-name">${escapeHtml(user.username)}</div>
          </div>
        `;
      }).join('');
    }

    function getInitial(name) {
      return name.charAt(0).toUpperCase();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.addEventListener('beforeunload', () => {
      if (userPresenceRef) remove(userPresenceRef);
    });
  </script>
</body>
</html>
