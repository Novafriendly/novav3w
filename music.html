<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Music</title><link rel="stylesheet" href="nova-music.css"><body>
<header><a class="brand" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13M9 9l12-2"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="18" cy="16" rx="3" ry="3"/></svg> <b>NOVA</b> MUSIC</a><button id="close" aria-label="Close music">✕</button></header>
<main><aside><div class="nav-label">NOVA MUSIC</div><button id="discover">⌂ Home</button><button id="search-nav">⌕ Search</button><div class="library"><small>Your Library</small><button id="new-list" aria-label="Create playlist">＋</button></div><button id="favorites"><span class="liked-icon">♥</span> Liked Songs</button><div id="lists"></div><p>Saved on this browser.</p></aside><section><div class="hero"><small>YOUR DAILY SOUNDTRACK</small><h1 id="greeting">Good evening</h1><p>Find something that feels like you.</p></div><nav id="moods" aria-label="Discover music"><button data-query="today hits">For you</button><button data-query="hip hop">Hip-hop</button><button data-query="pop hits">Pop</button><button data-query="chill instrumental">Unwind</button><button data-query="electronic dance">After hours</button><button data-query="indie alternative">Indie</button></nav><form id="search"><input id="query" type="search" placeholder="Search songs or artists…" aria-label="Search songs or artists" required maxlength="150"><button>Search ↗</button></form><div class="heading"><h2 id="title">Find your next favorite</h2><span>SONG PREVIEWS</span></div><p id="status" role="status">Search for an artist or song to begin.</p><div id="tracks"></div><div id="home-rows"></div></section></main>
<footer><img id="art" alt="" hidden><div class="now"><b id="song">Nothing playing yet</b><span id="artist">Choose a preview to start listening</span></div><button id="previous" aria-label="Previous song">⏮</button><button id="play" aria-label="Play or pause" disabled>▶</button><button id="next" aria-label="Next song">⏭</button><span id="time">0:00</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="Playback position" disabled><label class="volume">Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7"></label></footer>
<dialog id="playlist-dialog"><form method="dialog"><h2>Make a playlist</h2><input id="playlist-name" placeholder="Playlist name" maxlength="50" required><div><button value="cancel" formnovalidate>Cancel</button><button value="create">Create</button></div></form></dialog><script src="nova-music.js"></script></body></html>
