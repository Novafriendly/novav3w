<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova AI</title><link rel="stylesheet" href="nova-ai-page.css"><body><aside><button id="new">＋ New chat</button><div id="history"></div><small>Chats saved on this browser.<br>Images are sent to Groq when you send a message.</small></aside><main><header><button id="close" aria-label="Back to Nova">⌂</button><button id="sidebar" aria-label="Toggle conversations">☷</button><span>NOVA AI</span></header><section id="conversation"><div id="welcome"><h1>✦ <span id="greeting">What’s on your mind?</span></h1><p>A little curiosity goes a long way.</p></div><div id="messages" aria-live="polite"></div></section><form id="composer"><div id="attachment"></div><textarea id="prompt" placeholder="Ask anything…" aria-label="Message Nova AI" maxlength="6000" rows="2"></textarea><div class="tools"><label class="upload" title="Attach an image" aria-label="Attach an image">＋<input id="image" type="file" accept="image/jpeg,image/png,image/webp"></label><span class="tag">Chat</span><span class="hint">Image understanding</span><button id="send" aria-label="Send message">↑</button></div><p id="status" role="status"></p></form></main><script src="nova-music-wallpaper.js"></script><script src="nova-ai-page.js"></script></body></html>
