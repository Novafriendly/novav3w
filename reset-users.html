<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Chat - Reset Users</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: linear-gradient(135deg, #000000 0%, #1a0000 50%, #000000 100%);
      background-size: 200% 200%;
      animation: bgShift 8s ease infinite;
      color: white; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh;
      padding: 20px;
    }
    @keyframes bgShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .container { 
      max-width: 500px; 
      background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
      border: 2px solid;
      border-image: linear-gradient(90deg, #dc2626, #ef4444, #f87171, #dc2626) 1;
      border-radius: 16px; 
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(220, 38, 38, 0.3);
      position: relative;
      overflow: hidden;
    }
    .container::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(90deg, #dc2626, #ef4444, #f87171, #dc2626);
      background-size: 200% 100%;
      animation: gradientShift 3s ease infinite;
      border-radius: 16px;
      z-index: -1;
      opacity: 0.3;
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    h1 { 
      font-size: 32px; 
      margin-bottom: 16px; 
      background: linear-gradient(90deg, #ff4444, #ff6666, #ff8888, #ff4444);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 3s ease infinite;
      font-weight: 900;
    }
    p { 
      color: #999; 
      margin-bottom: 24px; 
      line-height: 1.6;
      font-size: 15px;
    }
    .warning {
      background: linear-gradient(135deg, rgba(255,68,68,0.15) 0%, rgba(255,68,68,0.05) 100%);
      border: 1px solid rgba(255,68,68,0.4);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(255,68,68,0.2);
    }
    .warning-title {
      color: #ff4444;
      font-weight: 800;
      font-size: 16px;
      text-transform: uppercase;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .warning-text {
      color: #ff8888;
      font-size: 14px;
      line-height: 1.6;
    }
    input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(0,0,0,0.5);
      border: 2px solid #333;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      margin-bottom: 20px;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #ff4444;
      box-shadow: 0 0 20px rgba(255,68,68,0.3);
      background: rgba(0,0,0,0.7);
    }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-danger {
      background: linear-gradient(90deg, #dc2626, #ef4444, #f87171, #dc2626);
      background-size: 200% 100%;
      animation: gradientShift 3s ease infinite;
      color: white;
      box-shadow: 0 8px 24px rgba(220, 38, 38, 0.4);
    }
    .btn-danger:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 32px rgba(220, 38, 38, 0.6);
    }
    .btn-danger:active {
      transform: translateY(0);
    }
    .btn-danger:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
      transform: none;
      animation: none;
      box-shadow: none;
    }
    #status {
      margin-top: 24px;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      display: none;
      font-weight: 600;
    }
    #status.success {
      background: linear-gradient(135deg, rgba(34,197,94,0.15) 0%, rgba(34,197,94,0.05) 100%);
      border: 1px solid rgba(34,197,94,0.4);
      color: #22c55e;
      display: block;
    }
    #status.error {
      background: linear-gradient(135deg, rgba(255,68,68,0.15) 0%, rgba(255,68,68,0.05) 100%);
      border: 1px solid rgba(255,68,68,0.4);
      color: #ff4444;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚠️ COMPLETE RESET</h1>
    <p>This will permanently delete EVERYTHING from Nova Chat database.</p>
    
    <div class="warning">
      <div class="warning-title">⚠️ Warning</div>
      <div class="warning-text">This action cannot be undone! All users, messages, channels, roles, bans, mutes, and ALL data will be permanently deleted.</div>
    </div>
    
    <input 
      type="password" 
      id="passcode" 
      placeholder="Enter owner passcode " 
      maxlength="4"
    >
    
    <button class="btn btn-danger" onclick="resetAllUsers()">
      DELETE EVERYTHING
    </button>
    
    <div id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getDatabase, ref, remove } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

    const app = initializeApp({
      apiKey: "AIzaSyDV9MRbv7IDXjowddQoXAN1hJPlCGMyxR8",
      authDomain: "nova-chat-43a18.firebaseapp.com",
      databaseURL: "https://nova-chat-43a18-default-rtdb.firebaseio.com",
      projectId: "nova-chat-43a18",
      storageBucket: "nova-chat-43a18.firebasestorage.app",
      messagingSenderId: "1090469740208",
      appId: "1:1090469740208:web:94adbe3ee21abb3cf14575"
    });

    const db = getDatabase(app);
    const OWNER_PASSCODE = '0090';

    window.resetAllUsers = async function() {
      const passcode = document.getElementById('passcode').value;
      const status = document.getElementById('status');
      const btn = document.querySelector('.btn-danger');
      
      if (passcode !== OWNER_PASSCODE) {
        status.className = 'error';
        status.textContent = '❌ Incorrect passcode!';
        return;
      }
      
      if (!confirm('Are you ABSOLUTELY SURE? This will delete EVERYTHING in the database permanently!')) {
        return;
      }
      
      if (!confirm('FINAL WARNING: All users, messages, channels, and data will be GONE FOREVER. Continue?')) {
        return;
      }
      
      btn.disabled = true;
      btn.textContent = 'Deleting...';
      status.style.display = 'none';
      
      try {
        // Delete all users
        await remove(ref(db, 'users'));
        
        // Delete all presence data
        await remove(ref(db, 'presence'));
        
        // Delete all custom roles
        await remove(ref(db, 'customRoles'));
        
        // Delete all bans
        await remove(ref(db, 'bans'));
        
        // Delete all mutes
        await remove(ref(db, 'mutes'));
        
        // Delete all channels and messages
        await remove(ref(db, 'channels'));
        
        // Delete all DMs
        await remove(ref(db, 'directMessages'));
        
        // Delete typing indicators
        await remove(ref(db, 'typing'));
        
        status.className = 'success';
        status.textContent = '✅ EVERYTHING deleted successfully! Database completely wiped.';
        btn.textContent = 'Completed';
        
        setTimeout(() => {
          window.location.href = 'home.html';
        }, 3000);
        
      } catch (error) {
        status.className = 'error';
        status.textContent = '❌ Error: ' + error.message;
        btn.disabled = false;
        btn.textContent = 'DELETE EVERYTHING';
      }
    };
    
    // Allow Enter key to submit
    document.getElementById('passcode').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        resetAllUsers();
      }
    });
  </script>
</body>
</html>
